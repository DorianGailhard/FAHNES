# @package _global_
defaults:
  - override /dataset: file
  - _self_

name: manifoldNetBench

dataset:
  name: manifoldNetBench
  visualization: mesh
  node_features_dim: 3
  node_features_noise_strength: 0.1
  node_features_on_simplex: False
  hyperedge_features_dim: 0
 
reduction:
  topological_cost_importance: 0
  rand_lambda: 0.1
  
method:
  augmented_radius: 0
  augmented_dropout: 0.5

model:
  name: ppgn
  node_features_emb_dim: 128
  hyperedge_features_emb_dim: 128 
  expansion_emb_dim: 32
  hidden_dim: 300
  ppgn_dim: 200
  num_layers: 10
  dropout: 0.

training:
  batch_size: 32

validation:
  batch_size: 32

spectral:
  num_eigenvectors: 0
